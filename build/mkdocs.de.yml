site_name: Benutzerdokumentation
site_url: https://himoose.com/docs/de/
site_description: Benutzerdokumentation für Hi, Moose - Plattform zur Optimierung
  für KI-Suche
site_author: Hi, Moose Team
repo_url: https://github.com/himoose/user-docs
repo_name: himoose/user-docs
edit_uri: ''
theme:
  name: shadcn
  logo: assets/logo-dark.svg
  favicon: assets/favicon.ico
  custom_dir: C:\HiMoose\platform\docs-site\overrides
  static_templates:
  - 404.html
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
extra_css:
- stylesheets/extra.css
extra_javascript:
- javascripts/custom.js
- javascripts/analytics.js
markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.emoji
- attr_list
- md_in_html
- toc:
    permalink: ¶
    permalink_class: headerlink
    toc_depth: 3
- tables
plugins:
- search:
    separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
    lang:
    - de
- minify:
    minify_html: true
extra:
  homepage: https://himoose.com
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/himoose
    name: Hi, Moose on Github
  - icon: fontawesome/brands/linkedin
    link: https://www.linkedin.com/company/hi-moose/
    name: Hi, Moose on LinkedIn
  base_url: https://himoose.com/docs
  locale: &id001
    code: de
    tag: de
    label: Deutsch
    prefix: /de
  languages:
  - code: en
    tag: en
    label: English
    prefix: ''
  - code: es
    tag: es
    label: Español
    prefix: /es
  - code: fr
    tag: fr
    label: Français
    prefix: /fr
  - *id001
  - code: it
    tag: it
    label: Italiano
    prefix: /it
  - code: pt
    tag: pt
    label: Português
    prefix: /pt
  default_language: en
  ui:
    site:
      name: Benutzerdokumentation
      description: Benutzerdokumentation für Hi, Moose - Plattform zur Optimierung
        für KI-Suche
    header:
      menu: Menü
      toggleMenu: Menü ein- oder ausblenden
      toggleTheme: Design wechseln
      toggleLayout: Layout wechseln
    search:
      label: Dokumentation durchsuchen...
      placeholder: Dokumentation durchsuchen...
      labelShort: Suchen...
    toc:
      onThisPage: Auf dieser Seite
    language:
      menuAriaLabel: Sprache auswählen
      panelLabel: Sprache
      availableAriaLabel: Verfügbare Sprachen
      currentStatus: Aktuell
    stale:
      title: Diese Seite ist möglicherweise nicht mehr aktuell
      body: Sie wurde aus einer älteren Fassung der englischen Seite übersetzt.
      linkLabel: Auf Englisch ansehen
    machineTranslated:
      title: Maschinell übersetzt
      body: Diese Seite wurde von einer KI übersetzt. Maßgeblich ist die englische
        Fassung.
      linkLabel: Auf Englisch lesen
    notTranslated:
      title: Noch nicht übersetzt
      body: Diese Seite ist in Ihrer Sprache noch nicht verfügbar und wird daher auf
        Englisch angezeigt.
  noindex_pages:
    en: []
    es: []
    fr: []
    de: []
    it: []
    pt: []
nav:
- Start: index.md
- Erste Schritte:
  - Installation und Anmeldung: getting-started/install-and-sign-in.md
  - Kontotypen und Tarife: getting-started/account-modes.md
  - Projekte und Arbeitsbereich: getting-started/projects.md
  - Einstellungen: getting-started/settings.md
  - Teamverwaltung: getting-started/team-management.md
- Posteingang:
  - Übersicht: inbox/overview.md
  - Benachrichtigungen: inbox/notifications.md
- Kontext:
  - Übersicht: getting-started/context/overview.md
  - Brand Voice: getting-started/context/brand-voice.md
  - Brand Truth Profile: getting-started/context/brand-truth-profile.md
  - Über Sie: getting-started/context/about-you.md
- Sichtbarkeit:
  - Übersicht: visibility/overview.md
  - Wettbewerber und Share of Voice: visibility/competitors.md
  - Prompt Manager: visibility/prompt-manager.md
  - Einstellungen: visibility/settings.md
- Website-Monitoring:
  - Übersicht: site-monitoring/overview.md
- Workflows:
  - Übersicht: workflows/overview.md
  - Verlorene Sichtbarkeit zurückgewinnen: workflows/recover-lost-visibility.md
  - Neue Inhalte erstellen: workflows/create-new-content.md
- Chat:
  - Übersicht: chat/overview.md
  - Chat-Werkzeuge und Spezialisten: chat/tools-and-specialists.md
  - Modellauswahl: chat/model-selection.md
  - Chats (Verlauf): chat/chats-history.md
- Artefakt-Bibliothek:
  - Übersicht: library/overview.md
- Audio:
  - Übersicht: audio/overview.md
  - Player und Einbettung: audio/player-and-embed.md
  - Hörstatistiken: audio/analytics.md
- Tools:
  - Das Tools-Menü: tools/overview.md
  - Sofortprüfung der Marke in der KI-Suche: tools/instant-brand-check.md
  - AEO Audits: features/aeo-audits.md
  - Content Briefs: features/content-briefs.md
  - FAQ-Generator: features/faq-generator.md
  - Key-Points-Extraktor: features/key-points.md
  - Grounding-Suchanfragen von AI Mode: features/grounding-queries.md
  - Fan-out-Suchanfragen von ChatGPT: features/fan-out-queries.md
  - Blogbeitrags-Entwurf: features/blog-post-draft.md
  - Glossarbeitrag: features/glossary-post.md
  - Landingpage-Inhalte: features/landing-page-content.md
  - Produktseiten-Inhalte: features/product-page-content.md
  - Entwürfe, Vorschau und Veröffentlichung: features/drafts-and-publishing.md
- Agenturen:
  - White-Label-Branding: agency/white-label.md
- Integrationen:
  - Grav: integrations/grav.md
  - WordPress: integrations/wordpress.md
  - Webflow: integrations/webflow.md
  - Google Search Console: integrations/google-search-console.md
- Frühere Web-App:
  - Versus Pages (programmatisches SEO): legacy/versus-pages.md
  - Topical Authority Builder: legacy/topical-authority.md
  - Listen to this Article (verschoben): legacy/listen-to-this-article.md
copyright: Copyright &copy; 2026 Hi, Moose
docs_dir: C:\HiMoose\platform\docs-site\build\docs-de
site_dir: C:\HiMoose\platform\docs-site\site\de
