site_name: User Documentation
site_url: https://himoose.com/docs/de/
site_description: User documentation for Hi, Moose - AI search optimization platform
site_author: Hi, Moose Team
repo_url: https://github.com/himoose/user-docs
repo_name: himoose/user-docs
edit_uri: ''
theme:
  name: shadcn
  logo: assets/logo-dark.svg
  favicon: assets/favicon.ico
  custom_dir: C:\HiMoose\platform\docs-site\overrides
  static_templates:
  - 404.html
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
extra_css:
- stylesheets/extra.css
extra_javascript:
- javascripts/custom.js
- javascripts/analytics.js
markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.emoji
- attr_list
- md_in_html
- toc:
    permalink: ¶
    permalink_class: headerlink
    toc_depth: 3
- tables
plugins:
- search:
    separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
    lang:
    - de
- minify:
    minify_html: true
extra:
  homepage: https://himoose.com
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/himoose
    name: Hi, Moose on Github
  - icon: fontawesome/brands/linkedin
    link: https://www.linkedin.com/company/hi-moose/
    name: Hi, Moose on LinkedIn
  base_url: https://himoose.com/docs
  locale: &id001
    code: de
    tag: de
    label: Deutsch
    prefix: /de
  languages:
  - code: en
    tag: en
    label: English
    prefix: ''
  - code: es
    tag: es
    label: Español
    prefix: /es
  - code: fr
    tag: fr
    label: Français
    prefix: /fr
  - *id001
  - code: it
    tag: it
    label: Italiano
    prefix: /it
  - code: pt
    tag: pt
    label: Português
    prefix: /pt
  default_language: en
  ui:
    site:
      name: User Documentation
      description: User documentation for Hi, Moose - AI search optimization platform
    header:
      menu: Menu
      toggleMenu: Toggle Menu
      toggleTheme: Toggle theme
      toggleLayout: Toggle layout
    search:
      label: Search documentation...
      placeholder: Search documentation...
      labelShort: Search...
    toc:
      onThisPage: On This Page
    language:
      menuAriaLabel: Choose a language
      panelLabel: Language
      availableAriaLabel: Available languages
      currentStatus: Current
    stale:
      title: This page may be out of date
      body: It was translated from an older version of the English page.
      linkLabel: View in English
    machineTranslated:
      title: Machine translated
      body: This page was translated by AI. The English version is the authoritative
        one.
      linkLabel: Read it in English
    notTranslated:
      title: Not translated yet
      body: This page is not available in your language yet, so it is shown in English.
  noindex_pages:
    en: []
    es: []
    fr: []
    de: []
    it: []
    pt: []
nav:
