site_name: Documentation utilisateur
site_url: https://himoose.com/docs/fr/
site_description: Documentation utilisateur de Hi, Moose - plateforme d'optimisation
  pour la recherche par IA
site_author: Hi, Moose Team
repo_url: https://github.com/himoose/user-docs
repo_name: himoose/user-docs
edit_uri: ''
theme:
  name: shadcn
  logo: assets/logo-dark.svg
  favicon: assets/favicon.ico
  custom_dir: C:\HiMoose\platform\docs-site\overrides
  static_templates:
  - 404.html
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
extra_css:
- stylesheets/extra.css
extra_javascript:
- javascripts/custom.js
- javascripts/analytics.js
markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.emoji
- attr_list
- md_in_html
- toc:
    permalink: ¶
    permalink_class: headerlink
    toc_depth: 3
- tables
plugins:
- search:
    separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
    lang:
    - fr
- minify:
    minify_html: true
extra:
  homepage: https://himoose.com
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/himoose
    name: Hi, Moose on Github
  - icon: fontawesome/brands/linkedin
    link: https://www.linkedin.com/company/hi-moose/
    name: Hi, Moose on LinkedIn
  base_url: https://himoose.com/docs
  locale: &id001
    code: fr
    tag: fr
    label: Français
    prefix: /fr
  languages:
  - code: en
    tag: en
    label: English
    prefix: ''
  - code: es
    tag: es
    label: Español
    prefix: /es
  - *id001
  - code: de
    tag: de
    label: Deutsch
    prefix: /de
  - code: it
    tag: it
    label: Italiano
    prefix: /it
  - code: pt
    tag: pt
    label: Português
    prefix: /pt
  default_language: en
  ui:
    site:
      name: Documentation utilisateur
      description: Documentation utilisateur de Hi, Moose - plateforme d'optimisation
        pour la recherche par IA
    header:
      menu: Menu
      toggleMenu: Afficher ou masquer le menu
      toggleTheme: Changer de thème
      toggleLayout: Changer de disposition
    search:
      label: Rechercher dans la documentation...
      placeholder: Rechercher dans la documentation...
      labelShort: Rechercher...
    toc:
      onThisPage: Sur cette page
    language:
      menuAriaLabel: Choisissez une langue
      panelLabel: Langue
      availableAriaLabel: Langues disponibles
      currentStatus: Actuelle
    stale:
      title: Cette page n'est peut-être plus à jour
      body: Elle a été traduite à partir d'une version antérieure de la page en anglais.
      linkLabel: Consulter en anglais
    machineTranslated:
      title: Traduction automatique
      body: Cette page a été traduite par IA. La version anglaise fait foi.
      linkLabel: La lire en anglais
    notTranslated:
      title: Pas encore traduite
      body: Cette page n'est pas encore disponible dans votre langue, elle s'affiche
        donc en anglais.
  noindex_pages:
    en: []
    es: []
    fr: []
    de: []
    it: []
    pt: []
nav:
- Accueil: index.md
- Premiers pas:
  - Installation et connexion: getting-started/install-and-sign-in.md
  - Types de compte et forfaits: getting-started/account-modes.md
  - Projets et espace de travail: getting-started/projects.md
  - Paramètres: getting-started/settings.md
  - Gestion de l'équipe: getting-started/team-management.md
- Inbox:
  - Vue d'ensemble: inbox/overview.md
  - Notifications: inbox/notifications.md
- Context:
  - Vue d'ensemble: getting-started/context/overview.md
  - Brand Voice: getting-started/context/brand-voice.md
  - Brand Truth Profile: getting-started/context/brand-truth-profile.md
  - À propos de vous: getting-started/context/about-you.md
- Visibility:
  - Vue d'ensemble: visibility/overview.md
  - Concurrents et Share of Voice: visibility/competitors.md
  - Prompt Manager: visibility/prompt-manager.md
  - Paramètres: visibility/settings.md
- Site Monitoring:
  - Vue d'ensemble: site-monitoring/overview.md
- Workflows:
  - Vue d'ensemble: workflows/overview.md
  - Récupérer la visibilité perdue: workflows/recover-lost-visibility.md
  - Créer du contenu: workflows/create-new-content.md
- Chat:
  - Vue d'ensemble: chat/overview.md
  - Outils et spécialistes du chat: chat/tools-and-specialists.md
  - Choix du modèle: chat/model-selection.md
  - Chats (historique): chat/chats-history.md
- Library:
  - Vue d'ensemble: library/overview.md
- Audio:
  - Vue d'ensemble: audio/overview.md
  - Lecteur et intégration: audio/player-and-embed.md
  - Statistiques d'écoute: audio/analytics.md
- Tools:
  - Le menu Tools: tools/overview.md
  - Vérification instantanée de marque dans la recherche par IA: tools/instant-brand-check.md
  - AEO Audits: features/aeo-audits.md
  - Content Briefs: features/content-briefs.md
  - Générateur de FAQ: features/faq-generator.md
  - Extracteur de Key Points: features/key-points.md
  - Requêtes de grounding d'AI Mode: features/grounding-queries.md
  - Requêtes fan-out de ChatGPT: features/fan-out-queries.md
  - Brouillon d'article de blog: features/blog-post-draft.md
  - Article de glossaire: features/glossary-post.md
  - Contenu de landing page: features/landing-page-content.md
  - Contenu de page produit: features/product-page-content.md
  - Brouillons, aperçu et publication: features/drafts-and-publishing.md
- Agences:
  - Marque blanche: agency/white-label.md
- Intégrations:
  - Grav: integrations/grav.md
  - WordPress: integrations/wordpress.md
  - Webflow: integrations/webflow.md
  - Google Search Console: integrations/google-search-console.md
- Ancienne application web:
  - Versus Pages (SEO programmatique): legacy/versus-pages.md
  - Topical Authority Builder: legacy/topical-authority.md
  - Listen to this Article (déplacé): legacy/listen-to-this-article.md
copyright: Copyright &copy; 2026 Hi, Moose
docs_dir: C:\HiMoose\platform\docs-site\build\docs-fr
site_dir: C:\HiMoose\platform\docs-site\site\fr
