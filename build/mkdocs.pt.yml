site_name: Documentação do usuário
site_url: https://himoose.com/docs/pt/
site_description: Documentação do usuário do Hi, Moose - plataforma de otimização
  para busca com IA
site_author: Hi, Moose Team
repo_url: https://github.com/himoose/user-docs
repo_name: himoose/user-docs
edit_uri: ''
theme:
  name: shadcn
  logo: assets/logo-dark.svg
  favicon: assets/favicon.ico
  custom_dir: C:\HiMoose\platform\docs-site\overrides
  static_templates:
  - 404.html
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
extra_css:
- stylesheets/extra.css
extra_javascript:
- javascripts/custom.js
- javascripts/analytics.js
markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.emoji
- attr_list
- md_in_html
- toc:
    permalink: ¶
    permalink_class: headerlink
    toc_depth: 3
- tables
plugins:
- search:
    separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
    lang:
    - pt
- minify:
    minify_html: true
extra:
  homepage: https://himoose.com
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/himoose
    name: Hi, Moose on Github
  - icon: fontawesome/brands/linkedin
    link: https://www.linkedin.com/company/hi-moose/
    name: Hi, Moose on LinkedIn
  base_url: https://himoose.com/docs
  locale: &id001
    code: pt
    tag: pt
    label: Português
    prefix: /pt
  languages:
  - code: en
    tag: en
    label: English
    prefix: ''
  - code: es
    tag: es
    label: Español
    prefix: /es
  - code: fr
    tag: fr
    label: Français
    prefix: /fr
  - code: de
    tag: de
    label: Deutsch
    prefix: /de
  - code: it
    tag: it
    label: Italiano
    prefix: /it
  - *id001
  default_language: en
  ui:
    site:
      name: Documentação do usuário
      description: Documentação do usuário do Hi, Moose - plataforma de otimização
        para busca com IA
    header:
      menu: Menu
      toggleMenu: Mostrar ou ocultar o menu
      toggleTheme: Alternar tema
      toggleLayout: Alternar layout
    search:
      label: Pesquisar na documentação...
      placeholder: Pesquisar na documentação...
      labelShort: Pesquisar...
    toc:
      onThisPage: Nesta página
    language:
      menuAriaLabel: Escolha um idioma
      panelLabel: Idioma
      availableAriaLabel: Idiomas disponíveis
      currentStatus: Atual
    stale:
      title: Esta página pode estar desatualizada
      body: Ela foi traduzida a partir de uma versão anterior da página em inglês.
      linkLabel: Ver em inglês
    machineTranslated:
      title: Tradução automática
      body: Esta página foi traduzida por IA. A versão em inglês é a versão oficial.
      linkLabel: Ler em inglês
    notTranslated:
      title: Ainda não traduzida
      body: Esta página ainda não está disponível no seu idioma, por isso é exibida
        em inglês.
  noindex_pages:
    en: []
    es: []
    fr: []
    de: []
    it: []
    pt: []
nav:
- Início: index.md
- Primeiros passos:
  - Instalação e login: getting-started/install-and-sign-in.md
  - Tipos de conta e planos: getting-started/account-modes.md
  - Projetos e espaço de trabalho: getting-started/projects.md
  - Configurações: getting-started/settings.md
  - Gerenciamento da equipe: getting-started/team-management.md
- Caixa de entrada:
  - Visão geral: inbox/overview.md
  - Notificações: inbox/notifications.md
- Contexto:
  - Visão geral: getting-started/context/overview.md
  - Voz da marca: getting-started/context/brand-voice.md
  - Perfil de Verdade da Marca: getting-started/context/brand-truth-profile.md
  - Sobre você: getting-started/context/about-you.md
- Visibilidade:
  - Visão geral: visibility/overview.md
  - Concorrentes e Share of Voice: visibility/competitors.md
  - Gerenciador de Prompts: visibility/prompt-manager.md
  - Configurações: visibility/settings.md
- Monitoramento do site:
  - Visão geral: site-monitoring/overview.md
- Fluxos de trabalho:
  - Visão geral: workflows/overview.md
  - Recuperar a visibilidade perdida: workflows/recover-lost-visibility.md
  - Criar novo conteúdo: workflows/create-new-content.md
- Chat:
  - Visão geral: chat/overview.md
  - Ferramentas e especialistas do chat: chat/tools-and-specialists.md
  - Seleção de modelo: chat/model-selection.md
  - Chats (histórico): chat/chats-history.md
- Biblioteca de artefatos:
  - Visão geral: library/overview.md
- Áudio:
  - Visão geral: audio/overview.md
  - Player e incorporação: audio/player-and-embed.md
  - Análises de audiência: audio/analytics.md
- Ferramentas:
  - O menu Ferramentas: tools/overview.md
  - Verificação instantânea da marca na busca com IA: tools/instant-brand-check.md
  - Auditorias de AEO: features/aeo-audits.md
  - Briefings de conteúdo: features/content-briefs.md
  - Gerador de FAQ: features/faq-generator.md
  - Extrator de Pontos principais: features/key-points.md
  - Consultas de grounding do AI Mode: features/grounding-queries.md
  - Consultas fan-out do ChatGPT: features/fan-out-queries.md
  - Rascunho de post de blog: features/blog-post-draft.md
  - Post de glossário: features/glossary-post.md
  - Conteúdo de landing page: features/landing-page-content.md
  - Conteúdo de página de produto: features/product-page-content.md
  - Rascunhos, prévia e publicação: features/drafts-and-publishing.md
- Agências:
  - Marca white label: agency/white-label.md
- Integrações:
  - Grav: integrations/grav.md
  - WordPress: integrations/wordpress.md
  - Webflow: integrations/webflow.md
  - Google Search Console: integrations/google-search-console.md
- Aplicativo web antigo:
  - Versus Pages (SEO programático): legacy/versus-pages.md
  - Topical Authority Builder: legacy/topical-authority.md
  - Listen to this Article (movido): legacy/listen-to-this-article.md
copyright: Copyright &copy; 2026 Hi, Moose
docs_dir: C:\HiMoose\platform\docs-site\build\docs-pt
site_dir: C:\HiMoose\platform\docs-site\site\pt
