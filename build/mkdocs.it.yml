site_name: Documentazione utente
site_url: https://himoose.com/docs/it/
site_description: Documentazione utente di Hi, Moose - piattaforma di ottimizzazione
  per la ricerca con IA
site_author: Hi, Moose Team
repo_url: https://github.com/himoose/user-docs
repo_name: himoose/user-docs
edit_uri: ''
theme:
  name: shadcn
  logo: assets/logo-dark.svg
  favicon: assets/favicon.ico
  custom_dir: C:\HiMoose\platform\docs-site\overrides
  static_templates:
  - 404.html
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
extra_css:
- stylesheets/extra.css
extra_javascript:
- javascripts/custom.js
- javascripts/analytics.js
markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.emoji
- attr_list
- md_in_html
- toc:
    permalink: ¶
    permalink_class: headerlink
    toc_depth: 3
- tables
plugins:
- search:
    separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
    lang:
    - it
- minify:
    minify_html: true
extra:
  homepage: https://himoose.com
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/himoose
    name: Hi, Moose on Github
  - icon: fontawesome/brands/linkedin
    link: https://www.linkedin.com/company/hi-moose/
    name: Hi, Moose on LinkedIn
  base_url: https://himoose.com/docs
  locale: &id001
    code: it
    tag: it
    label: Italiano
    prefix: /it
  languages:
  - code: en
    tag: en
    label: English
    prefix: ''
  - code: es
    tag: es
    label: Español
    prefix: /es
  - code: fr
    tag: fr
    label: Français
    prefix: /fr
  - code: de
    tag: de
    label: Deutsch
    prefix: /de
  - *id001
  - code: pt
    tag: pt
    label: Português
    prefix: /pt
  default_language: en
  ui:
    site:
      name: Documentazione utente
      description: Documentazione utente di Hi, Moose - piattaforma di ottimizzazione
        per la ricerca con IA
    header:
      menu: Menu
      toggleMenu: Mostra o nascondi il menu
      toggleTheme: Cambia tema
      toggleLayout: Cambia disposizione
    search:
      label: Cerca nella documentazione...
      placeholder: Cerca nella documentazione...
      labelShort: Cerca...
    toc:
      onThisPage: In questa pagina
    language:
      menuAriaLabel: Scelga una lingua
      panelLabel: Lingua
      availableAriaLabel: Lingue disponibili
      currentStatus: Attuale
    stale:
      title: Questa pagina potrebbe non essere aggiornata
      body: È stata tradotta da una versione precedente della pagina in inglese.
      linkLabel: Consulta in inglese
    machineTranslated:
      title: Traduzione automatica
      body: Questa pagina è stata tradotta da un'IA. La versione inglese è quella
        di riferimento.
      linkLabel: Leggila in inglese
    notTranslated:
      title: Non ancora tradotta
      body: Questa pagina non è ancora disponibile nella sua lingua, perciò viene
        mostrata in inglese.
  noindex_pages:
    en: []
    es: []
    fr: []
    de: []
    it: []
    pt: []
nav:
- Home: index.md
- Primi passi:
  - Installazione e accesso: getting-started/install-and-sign-in.md
  - Tipi di account e piani: getting-started/account-modes.md
  - Progetti e spazio di lavoro: getting-started/projects.md
  - Impostazioni: getting-started/settings.md
  - Gestione del team: getting-started/team-management.md
- Inbox:
  - Panoramica: inbox/overview.md
  - Notifiche: inbox/notifications.md
- Context:
  - Panoramica: getting-started/context/overview.md
  - Brand Voice: getting-started/context/brand-voice.md
  - Brand Truth Profile: getting-started/context/brand-truth-profile.md
  - Su di lei: getting-started/context/about-you.md
- Visibility:
  - Panoramica: visibility/overview.md
  - Concorrenti e Share of Voice: visibility/competitors.md
  - Prompt Manager: visibility/prompt-manager.md
  - Impostazioni: visibility/settings.md
- Site Monitoring:
  - Panoramica: site-monitoring/overview.md
- Workflows:
  - Panoramica: workflows/overview.md
  - Recuperare la visibilità perduta: workflows/recover-lost-visibility.md
  - Creare nuovi contenuti: workflows/create-new-content.md
- Chat:
  - Panoramica: chat/overview.md
  - Strumenti e specialisti della chat: chat/tools-and-specialists.md
  - Scelta del modello: chat/model-selection.md
  - Chat (cronologia): chat/chats-history.md
- Library:
  - Panoramica: library/overview.md
- Audio:
  - Panoramica: audio/overview.md
  - Player e incorporamento: audio/player-and-embed.md
  - Statistiche di ascolto: audio/analytics.md
- Tools:
  - Il menu Tools: tools/overview.md
  - Verifica istantanea del marchio nella ricerca con IA: tools/instant-brand-check.md
  - AEO Audits: features/aeo-audits.md
  - Content Briefs: features/content-briefs.md
  - Generatore di FAQ: features/faq-generator.md
  - Estrattore di Key Points: features/key-points.md
  - Query di grounding di AI Mode: features/grounding-queries.md
  - Query fan-out di ChatGPT: features/fan-out-queries.md
  - Bozza di articolo del blog: features/blog-post-draft.md
  - Voce di glossario: features/glossary-post.md
  - Contenuti per landing page: features/landing-page-content.md
  - Contenuti per pagina prodotto: features/product-page-content.md
  - Bozze, anteprima e pubblicazione: features/drafts-and-publishing.md
- Agenzie:
  - Personalizzazione white label: agency/white-label.md
- Integrazioni:
  - Grav: integrations/grav.md
  - WordPress: integrations/wordpress.md
  - Webflow: integrations/webflow.md
  - Google Search Console: integrations/google-search-console.md
- Vecchia app web:
  - Versus Pages (SEO programmatica): legacy/versus-pages.md
  - Topical Authority Builder: legacy/topical-authority.md
  - Listen to this Article (spostato): legacy/listen-to-this-article.md
copyright: Copyright &copy; 2026 Hi, Moose
docs_dir: C:\HiMoose\platform\docs-site\build\docs-it
site_dir: C:\HiMoose\platform\docs-site\site\it
