  - Tipos de cuenta y planes: getting-started/account-modes.md
  - Proyectos y espacio de trabajo: getting-started/projects.md
  - Configuración: getting-started/settings.md
  - Gestión del equipo: getting-started/team-management.md
- Inbox:
  - Descripción general: inbox/overview.md
  - Notificaciones: inbox/notifications.md
- Context:
  - Descripción general: getting-started/context/overview.md
  - Brand Voice: getting-started/context/brand-voice.md
  - Brand Truth Profile: getting-started/context/brand-truth-profile.md
  - Sobre usted: getting-started/context/about-you.md
- Visibility:
  - Descripción general: visibility/overview.md
  - Competidores y Share of Voice: visibility/competitors.md
  - Prompt Manager: visibility/prompt-manager.md
  - Configuración: visibility/settings.md
- Site Monitoring:
  - Descripción general: site-monitoring/overview.md
- Workflows:
  - Descripción general: workflows/overview.md
  - Recuperar visibilidad perdida: workflows/recover-lost-visibility.md
  - Crear contenido nuevo: workflows/create-new-content.md
- Chat:
  - Descripción general: chat/overview.md
  - Herramientas y especialistas del chat: chat/tools-and-specialists.md
  - Selección de modelo: chat/model-selection.md
  - Chats (historial): chat/chats-history.md
- Library:
  - Descripción general: library/overview.md
- Audio:
  - Descripción general: audio/overview.md
  - Reproductor e inserción: audio/player-and-embed.md
  - Analíticas de escucha: audio/analytics.md
- Tools:
  - El menú Tools: tools/overview.md
  - Comprobación instantánea de marca en búsqueda con IA: tools/instant-brand-check.md
  - AEO Audits: features/aeo-audits.md
  - Content Briefs: features/content-briefs.md
  - Generador de FAQ: features/faq-generator.md
  - Extractor de Key Points: features/key-points.md
  - Consultas de grounding de AI Mode: features/grounding-queries.md
  - Consultas fan-out de ChatGPT: features/fan-out-queries.md
  - Borrador de entrada de blog: features/blog-post-draft.md
  - Entrada de glosario: features/glossary-post.md
  - Contenido de landing page: features/landing-page-content.md
  - Contenido de página de producto: features/product-page-content.md
  - Borradores, vista previa y publicación: features/drafts-and-publishing.md
- Agencias:
  - Marca blanca: agency/white-label.md
- Integraciones:
  - Grav: integrations/grav.md
  - WordPress: integrations/wordpress.md
  - Webflow: integrations/webflow.md
  - Google Search Console: integrations/google-search-console.md
- Aplicación web anterior:
  - Versus Pages (SEO programático): legacy/versus-pages.md
  - Topical Authority Builder: legacy/topical-authority.md
  - Listen to this Article (trasladado): legacy/listen-to-this-article.md
copyright: Copyright &copy; 2026 Hi, Moose
docs_dir: C:\HiMoose\platform\docs-site\build\docs-es
site_dir: C:\HiMoose\platform\docs-site\site\es
