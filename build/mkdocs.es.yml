site_name: Documentación de usuario
site_url: https://himoose.com/docs/es/
site_description: Documentación de usuario de Hi, Moose - plataforma de optimización
  para búsqueda con IA
site_author: Hi, Moose Team
repo_url: https://github.com/himoose/user-docs
repo_name: himoose/user-docs
edit_uri: ''
theme:
  name: shadcn
  logo: assets/logo-dark.svg
  favicon: assets/favicon.ico
  custom_dir: C:\HiMoose\platform\docs-site\overrides
  static_templates:
  - 404.html
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
extra_css:
- stylesheets/extra.css
extra_javascript:
- javascripts/custom.js
- javascripts/analytics.js
markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.emoji
- attr_list
- md_in_html
- toc:
    permalink: ¶
    permalink_class: headerlink
    toc_depth: 3
- tables
plugins:
- search:
    separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
    lang:
    - es
- minify:
    minify_html: true
extra:
  homepage: https://himoose.com
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/himoose
    name: Hi, Moose on Github
  - icon: fontawesome/brands/linkedin
    link: https://www.linkedin.com/company/hi-moose/
    name: Hi, Moose on LinkedIn
  base_url: https://himoose.com/docs
  locale: &id001
    code: es
    tag: es
    label: Español
    prefix: /es
  languages:
  - code: en
    tag: en
    label: English
    prefix: ''
  - *id001
  - code: fr
    tag: fr
    label: Français
    prefix: /fr
  - code: de
    tag: de
    label: Deutsch
    prefix: /de
  - code: it
    tag: it
    label: Italiano
    prefix: /it
  - code: pt
    tag: pt
    label: Português
    prefix: /pt
  default_language: en
  ui:
    site:
      name: Documentación de usuario
      description: Documentación de usuario de Hi, Moose - plataforma de optimización
        para búsqueda con IA
    header:
      menu: Menú
      toggleMenu: Mostrar u ocultar el menú
      toggleTheme: Cambiar el tema
      toggleLayout: Cambiar la disposición
    search:
      label: Buscar en la documentación...
      placeholder: Buscar en la documentación...
      labelShort: Buscar...
    toc:
      onThisPage: En esta página
    language:
      menuAriaLabel: Elija un idioma
      panelLabel: Idioma
      availableAriaLabel: Idiomas disponibles
      currentStatus: Actual
    stale:
      title: Es posible que esta página esté desactualizada
      body: Se tradujo a partir de una versión anterior de la página en inglés.
      linkLabel: Ver en inglés
    machineTranslated:
      title: Traducción automática
      body: Esta página fue traducida por IA. La versión en inglés es la versión autorizada.
      linkLabel: Leerla en inglés
    notTranslated:
      title: Todavía sin traducir
      body: Esta página aún no está disponible en su idioma, por lo que se muestra
        en inglés.
  noindex_pages:
    en: []
    es: []
    fr: []
    de: []
    it: []
    pt: []
nav:
